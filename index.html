<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>The tile, alive</title>
    <style>
      :root {
        --paper: #fff;
        --ink: #141414;
        --ink-soft: rgba(20, 20, 20, 0.66);
        --line: rgba(20, 20, 20, 0.2);
        --panel: rgba(255, 255, 255, 0.9);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
        overflow: hidden;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: manipulation;
        cursor: pointer;
      }
      .caption {
        position: fixed;
        top: 18px;
        left: 18px;
        max-width: 384px;
        padding: 14px 16px;
        pointer-events: none;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
      }
      .caption h1 {
        margin: 0 0 8px;
        font-size: clamp(22px, 3.4vw, 31px);
        font-weight: 600;
        line-height: 1.12;
      }
      .caption p {
        margin: 0;
        font-size: 14px;
        line-height: 1.55;
        color: var(--ink-soft);
      }
      .panel {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px 14px;
        max-width: 94vw;
        padding: 10px 16px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      .panel button {
        font: inherit;
        font-size: 12px;
        color: var(--ink);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 6px 13px;
        cursor: pointer;
        white-space: nowrap;
      }
      .panel button:hover { border-color: var(--ink); }
      .panel button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--paper);
        border-color: var(--ink);
      }
      .panel button:focus-visible, .panel input:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      .panel label {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 10px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }
      .panel input[type="range"] {
        width: 90px;
        accent-color: var(--ink);
      }
      .bare .caption, .bare .panel { display: none; }
      .bare canvas { cursor: default; }
      @media (max-width: 560px) {
        .caption { top: 10px; left: 10px; max-width: calc(100vw - 20px); }
        .caption p { font-size: 13px; }
        .panel { bottom: 10px; padding: 9px 12px; }
      }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-label="The ucalyptus.me cross-stitch background tile, animated: motifs crawl into empty cells and re-stitch themselves into one another"></canvas>

    <div class="caption">
      <h1>The tile, alive.</h1>
      <p>
        The cross-stitch tile behind ucalyptus.me, set moving. Every mark is
        still a single <em>x</em> stitch: motifs crawl into the empty cells and
        re-stitch themselves into their neighbours, a quarter-turn at a time.
        Click a motif to re-stitch it, or an empty cell to call one over.
      </p>
    </div>

    <div class="panel" role="group" aria-label="Animation controls">
      <button id="btnPlay" type="button">Pause</button>
      <button id="btnInk" type="button" aria-pressed="false">Full ink</button>
      <button id="btnDrift" type="button" aria-pressed="false">Drift</button>
      <label>Tempo <input id="rngTempo" type="range" min="0.25" max="3" step="0.05" value="1" /></label>
    </div>

    <script src="stitches.js"></script>
    <script>
    (function () {
      "use strict";

      var D = window.STITCH_TILE;
      var T = D.size, PITCH = D.pitch, ARM = D.arm, STROKE = D.stroke, CELLS = D.cells;
      var TILE_CSS = 720;                       // the site's $site-background-tile-size
      var EDGE = ARM + STROKE;                  // stitches this close to a tile edge also paint across it
      var INK_FAINT = "rgb(227, 227, 227)";     // #141414 under the site's 0.88 white scrim
      var INK_FULL = "#141414";
      var MORPH_SECONDS = 2.8, MIGRATE_SECONDS = 3.4, MAX_EVENTS = 3;

      var params = new URLSearchParams(location.search);
      if (params.has("bare")) document.documentElement.classList.add("bare");

      var SHAPES = D.shapes.map(function (flat) {
        var pts = [], rMax = 0;
        for (var i = 0; i < flat.length; i += 2) {
          var x = flat[i] * PITCH, y = flat[i + 1] * PITCH;
          pts.push({ x: x, y: y });
          rMax = Math.max(rMax, Math.hypot(x, y));
        }
        return { pts: pts, rMax: rMax };
      });

      var SLOTS = D.slots.map(function (s, i) {
        return { x: s[0], y: s[1], shape: s[2], busy: false, col: i % CELLS, row: Math.floor(i / CELLS) };
      });

      function mod(v, m) { return ((v % m) + m) % m; }
      function wrapT(d) { return d - T * Math.round(d / T); }
      function wrapPi(a) { return a - 2 * Math.PI * Math.round(a / (2 * Math.PI)); }
      function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
      function ease(v) { return v < 0.5 ? 4 * v * v * v : 1 - Math.pow(-2 * v + 2, 3) / 2; }
      function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

      function neighbours(slot) {
        var c = slot.col, r = slot.row;
        return [
          SLOTS[r * CELLS + (c + 1) % CELLS],
          SLOTS[r * CELLS + (c + CELLS - 1) % CELLS],
          SLOTS[((r + 1) % CELLS) * CELLS + c],
          SLOTS[((r + CELLS - 1) % CELLS) * CELLS + c]
        ];
      }

      // --- stitch matching between two motif shapes --------------------------
      // Greedy closest-pair assignment. Leftover stitches on the larger side
      // pair with their nearest stitch on the other side and grow in from it
      // (scale 0 -> 1) or shrink into it (1 -> 0).
      var matchCache = {};
      function match(a, b) {
        var key = a + ">" + b;
        if (matchCache[key]) return matchCache[key];
        var A = SHAPES[a].pts, B = SHAPES[b].pts, pairs = [];
        for (var i = 0; i < A.length; i++) {
          for (var j = 0; j < B.length; j++) {
            pairs.push([(A[i].x - B[j].x) * (A[i].x - B[j].x) + (A[i].y - B[j].y) * (A[i].y - B[j].y), i, j]);
          }
        }
        pairs.sort(function (u, v) { return u[0] - v[0]; });
        var nearA = new Array(B.length), nearB = new Array(A.length);
        var usedA = new Array(A.length), usedB = new Array(B.length), out = [];
        pairs.forEach(function (pr) {
          var i = pr[1], j = pr[2];
          if (nearB[i] === undefined) nearB[i] = j;
          if (nearA[j] === undefined) nearA[j] = i;
          if (usedA[i] || usedB[j]) return;
          usedA[i] = usedB[j] = true;
          out.push({ p: A[i], q: B[j], s0: 1, s1: 1 });
        });
        A.forEach(function (p, i) { if (!usedA[i]) out.push({ p: p, q: B[nearB[i]], s0: 1, s1: 0 }); });
        B.forEach(function (q, j) { if (!usedB[j]) out.push({ p: A[nearA[j]], q: q, s0: 0, s1: 1 }); });
        return (matchCache[key] = out);
      }

      // --- events --------------------------------------------------------------
      // Rest state is exact: an idle motif is its shape on its own stitch grid.
      // Stitches only leave the grid while an event carries them somewhere.
      var events = [];
      var simTime = 0;

      // Re-stitch a motif into another shape. Every stitch travels in polar
      // coordinates around the motif centre plus a shared quarter-turn, so the
      // body twists as it reforms. All motifs have 90-degree symmetry, so the
      // turned target lands exactly on the target shape.
      function startMorph(slot, to) {
        var from = slot.shape;
        var turn = (Math.random() < 0.5 ? -0.5 : 0.5) * Math.PI;
        var rMax = Math.max(SHAPES[from].rMax, SHAPES[to].rMax);
        var parts = match(from, to).map(function (m) {
          var r0 = Math.hypot(m.p.x, m.p.y), r1 = Math.hypot(m.q.x, m.q.y);
          var a0 = Math.atan2(m.p.y, m.p.x), a1 = Math.atan2(m.q.y, m.q.x);
          if (r0 === 0) a0 = a1;
          if (r1 === 0) a1 = a0;
          return { r0: r0, r1: r1, a0: a0, da: wrapPi(a1 - a0) + turn, s0: m.s0, s1: m.s1, delay: 0.4 * r0 / rMax };
        });
        slot.busy = true;
        events.push({
          t0: simTime, dur: MORPH_SECONDS,
          draw: function (u, emit) {
            parts.forEach(function (pt) {
              var k = clamp01((u - pt.delay) / 0.6), e = ease(k);
              var r = pt.r0 + (pt.r1 - pt.r0) * e, a = pt.a0 + pt.da * e;
              var s = (pt.s0 + (pt.s1 - pt.s0) * e) * (1 - 0.22 * Math.sin(Math.PI * k));
              emit(slot.x + r * Math.cos(a), slot.y + r * Math.sin(a), s, e * Math.PI / 2);
            });
          },
          end: function () { slot.shape = to; slot.busy = false; }
        });
      }

      // Crawl a motif into a neighbouring empty cell: the leading edge sets off
      // first and the tail catches up, with a sideways ripple down the body.
      function startMigrate(from, to) {
        var shape = SHAPES[from.shape], id = from.shape;
        var dx = wrapT(to.x - from.x), dy = wrapT(to.y - from.y);
        var len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
        var parts = shape.pts.map(function (p) {
          var front = (p.x * ux + p.y * uy + shape.rMax) / (2 * shape.rMax);
          return { x: from.x + p.x, y: from.y + p.y, delay: 0.3 * (1 - front), front: front };
        });
        var sway = (Math.random() < 0.5 ? -1 : 1) * 0.9 * PITCH;
        from.shape = -1;
        from.busy = to.busy = true;
        events.push({
          t0: simTime, dur: MIGRATE_SECONDS,
          draw: function (u, emit) {
            parts.forEach(function (pt) {
              var k = clamp01((u - pt.delay) / 0.7), e = ease(k);
              var side = sway * Math.sin(Math.PI * k) * Math.sin(2 * Math.PI * pt.front);
              emit(pt.x + dx * e - uy * side, pt.y + dy * e + ux * side, 1 - 0.18 * Math.sin(Math.PI * k), e * Math.PI / 2);
            });
          },
          end: function () { to.shape = id; from.busy = to.busy = false; }
        });
      }

      function otherShape(slot) {
        var avoid = neighbours(slot).map(function (n) { return n.shape; }).concat(slot.shape);
        var all = SHAPES.map(function (_, i) { return i; });
        var fresh = all.filter(function (i) { return avoid.indexOf(i) < 0; });
        return pick(fresh.length ? fresh : all.filter(function (i) { return i !== slot.shape; }));
      }

      function emptyNeighbour(slot) {
        var free = neighbours(slot).filter(function (n) { return n.shape < 0 && !n.busy; });
        return free.length ? pick(free) : null;
      }

      var nextEventAt = 0.6;
      function schedule() {
        if (simTime < nextEventAt) return;
        nextEventAt = simTime + 0.7 + Math.random() * 1.3;
        if (events.length >= MAX_EVENTS) return;
        var idle = SLOTS.filter(function (s) { return !s.busy && s.shape >= 0; });
        var moves = idle.filter(emptyNeighbour);
        if (moves.length && (Math.random() < 0.55 || !idle.length)) {
          var from = pick(moves);
          startMigrate(from, emptyNeighbour(from));
        } else if (idle.length) {
          var slot = pick(idle);
          startMorph(slot, otherShape(slot));
        }
      }

      function step() {
        for (var i = events.length - 1; i >= 0; i--) {
          if (simTime - events[i].t0 >= events[i].dur) {
            events[i].end();
            events.splice(i, 1);
            tileDirty = true;
          }
        }
        schedule();
      }

      // --- drawing -------------------------------------------------------------
      // One 720px tile is redrawn per frame (about 1,800 stitches), then laid
      // across the viewport like the site's repeating background.
      var stage = document.getElementById("stage");
      var ctx = stage.getContext("2d");
      var tile = document.createElement("canvas");
      var tctx = tile.getContext("2d");
      var dpr = 1, tileDirty = true, stageDirty = true;
      var fullInk = params.get("ink") === "full";
      var drift = params.has("drift"), driftX = 0, driftY = 0;
      var partial = [];

      function segment(X, Y, ax, ay, bx, by) {
        tctx.moveTo(X - ax, Y - ay); tctx.lineTo(X + ax, Y + ay);
        tctx.moveTo(X - bx, Y - by); tctx.lineTo(X + bx, Y + by);
      }

      // Adds one x stitch (centre, scale, rotation) to the current path,
      // repeated across the tile edges it overlaps so the tile stays seamless.
      function stitch(x, y, s, a) {
        x = mod(x, T); y = mod(y, T);
        var h = ARM * s, c = Math.cos(a) * h, sn = Math.sin(a) * h;
        var ax = c - sn, ay = sn + c, bx = c + sn, by = sn - c;
        var x2 = x < EDGE ? x + T : x > T - EDGE ? x - T : NaN;
        var y2 = y < EDGE ? y + T : y > T - EDGE ? y - T : NaN;
        segment(x, y, ax, ay, bx, by);
        if (x2 === x2) segment(x2, y, ax, ay, bx, by);
        if (y2 === y2) segment(x, y2, ax, ay, bx, by);
        if (x2 === x2 && y2 === y2) segment(x2, y2, ax, ay, bx, by);
      }

      // Full-size stitches share one stroke; shrunken ones are batched by size
      // so their line width shrinks with them instead of leaving round dots.
      function emit(x, y, s, a) {
        if (s >= 0.999) stitch(x, y, 1, a);
        else if (s > 0.02) partial.push(x, y, s, a);
      }

      function drawTile() {
        tctx.setTransform(1, 0, 0, 1, 0, 0);
        tctx.fillStyle = "#fff";
        tctx.fillRect(0, 0, tile.width, tile.height);
        var k = tile.width / T;
        tctx.setTransform(k, 0, 0, k, 0, 0);
        tctx.strokeStyle = fullInk ? INK_FULL : INK_FAINT;
        tctx.lineCap = "round";
        tctx.lineWidth = STROKE;
        partial.length = 0;

        tctx.beginPath();
        SLOTS.forEach(function (slot) {
          if (slot.busy || slot.shape < 0) return;
          SHAPES[slot.shape].pts.forEach(function (p) { stitch(slot.x + p.x, slot.y + p.y, 1, 0); });
        });
        events.forEach(function (ev) { ev.draw(clamp01((simTime - ev.t0) / ev.dur), emit); });
        tctx.stroke();

        for (var level = 1; level <= 8; level++) {
          var lo = (level - 1) / 8, hi = level / 8, any = false;
          tctx.beginPath();
          for (var i = 0; i < partial.length; i += 4) {
            var s = partial[i + 2];
            if (s > lo && s <= hi) { stitch(partial[i], partial[i + 1], s, partial[i + 3]); any = true; }
          }
          if (!any) continue;
          tctx.lineWidth = STROKE * (lo + hi) / 2;
          tctx.stroke();
        }
      }

      function drawStage() {
        var size = tile.width;
        var ox = -mod(Math.round(driftX * dpr), size), oy = -mod(Math.round(driftY * dpr), size);
        for (var y = oy; y < stage.height; y += size) {
          for (var x = ox; x < stage.width; x += size) ctx.drawImage(tile, x, y);
        }
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        var size = Math.round(TILE_CSS * dpr);
        if (tile.width !== size) { tile.width = tile.height = size; tileDirty = true; }
        stage.width = Math.round(window.innerWidth * dpr);
        stage.height = Math.round(window.innerHeight * dpr);
        stageDirty = true;
      }
      window.addEventListener("resize", resize);
      resize();

      // --- controls ------------------------------------------------------------
      var playing = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var tempo = 1;
      var btnPlay = document.getElementById("btnPlay");
      var btnInk = document.getElementById("btnInk");
      var btnDrift = document.getElementById("btnDrift");

      function syncControls() {
        btnPlay.textContent = playing ? "Pause" : "Play";
        btnInk.setAttribute("aria-pressed", String(fullInk));
        btnDrift.setAttribute("aria-pressed", String(drift));
      }
      syncControls();

      btnPlay.addEventListener("click", function () { playing = !playing; syncControls(); });
      btnInk.addEventListener("click", function () { fullInk = !fullInk; tileDirty = true; syncControls(); });
      btnDrift.addEventListener("click", function () { drift = !drift; syncControls(); });
      document.getElementById("rngTempo").addEventListener("input", function (e) { tempo = parseFloat(e.target.value); });

      // Click a motif to re-stitch it; click an empty cell to pull a neighbour in.
      stage.addEventListener("pointerdown", function (e) {
        if (document.documentElement.classList.contains("bare")) return;
        var tx = mod((e.clientX + driftX) * T / TILE_CSS, T), ty = mod((e.clientY + driftY) * T / TILE_CSS, T);
        var best = null, bestD = Infinity;
        SLOTS.forEach(function (s) {
          var d = Math.hypot(wrapT(tx - s.x), wrapT(ty - s.y));
          if (d < bestD) { bestD = d; best = s; }
        });
        if (!best || best.busy || bestD > T / CELLS / 2) return;
        if (best.shape >= 0) {
          startMorph(best, otherShape(best));
        } else {
          var callers = neighbours(best).filter(function (n) { return n.shape >= 0 && !n.busy; });
          if (!callers.length) return;
          startMigrate(pick(callers), best);
        }
        if (!playing) { playing = true; syncControls(); }
      });

      // --- loop ------------------------------------------------------------------
      var last = performance.now();
      function frame(now) {
        requestAnimationFrame(frame);
        var dt = Math.min((now - last) / 1000, 0.05);
        last = now;
        if (playing) {
          simTime += dt * tempo;
          step();
          if (drift) { driftX += dt * tempo * 9; driftY += dt * tempo * 5; stageDirty = true; }
        }
        if (events.length) tileDirty = true;
        if (tileDirty) { drawTile(); tileDirty = false; stageDirty = true; }
        if (stageDirty) { drawStage(); stageDirty = false; }
      }
      requestAnimationFrame(frame);
    })();
    </script>
  </body>
</html>
