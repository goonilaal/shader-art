<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>The tile, alive</title>
    <style>
      :root {
        --paper: #fff;
        --ink: #141414;
        --ink-soft: rgba(20, 20, 20, 0.66);
        --line: rgba(20, 20, 20, 0.2);
        --panel: rgba(255, 255, 255, 0.9);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
        overflow: hidden;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: manipulation;
        cursor: pointer;
      }
      .caption {
        position: fixed;
        top: 18px;
        left: 18px;
        max-width: 384px;
        padding: 14px 16px;
        pointer-events: none;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
      }
      .caption h1 {
        margin: 0 0 8px;
        font-size: clamp(22px, 3.4vw, 31px);
        font-weight: 600;
        line-height: 1.12;
      }
      .caption p {
        margin: 0;
        font-size: 14px;
        line-height: 1.55;
        color: var(--ink-soft);
      }
      .panel {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px 14px;
        max-width: 94vw;
        padding: 10px 16px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      .panel button {
        font: inherit;
        font-size: 12px;
        color: var(--ink);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 6px 13px;
        cursor: pointer;
        white-space: nowrap;
      }
      .panel button:hover { border-color: var(--ink); }
      .panel button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--paper);
        border-color: var(--ink);
      }
      .panel button:focus-visible, .panel input:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      .panel label {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 10px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }
      .panel input[type="range"] {
        width: 90px;
        accent-color: var(--ink);
      }
      .bare .caption, .bare .panel { display: none; }
      .bare canvas { cursor: default; }
      @media (max-width: 560px) {
        .caption { top: 10px; left: 10px; max-width: calc(100vw - 20px); }
        .caption p { font-size: 13px; }
        .panel { bottom: 10px; padding: 9px 12px; }
      }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-label="The ucalyptus.me cross-stitch background tile, animated: each motif breathes like an organism, its centre still while its arms contract and expand"></canvas>

    <div class="caption">
      <h1>The tile, alive.</h1>
      <p>
        The cross-stitch tile behind ucalyptus.me, alive. Each motif is its own
        organism: the centre holds still while the arms contract and expand,
        each pulse rippling out to the tips, one side reaching further than the
        other. Click one to startle it.
      </p>
    </div>

    <div class="panel" role="group" aria-label="Animation controls">
      <button id="btnPlay" type="button">Pause</button>
      <button id="btnInk" type="button" aria-pressed="false">Full ink</button>
      <button id="btnDrift" type="button" aria-pressed="false">Drift</button>
      <label>Tempo <input id="rngTempo" type="range" min="0.25" max="3" step="0.05" value="1" /></label>
    </div>

    <script src="stitches.js"></script>
    <script>
    (function () {
      "use strict";

      var D = window.STITCH_TILE;
      var T = D.size, PITCH = D.pitch, ARM = D.arm, STROKE = D.stroke;
      var TILE_CSS = 720;                       // the site's $site-background-tile-size
      var EDGE = ARM + STROKE;                  // stitches this close to a tile edge also paint across it
      var INK_FAINT = "rgb(227, 227, 227)";     // #141414 under the site's 0.88 white scrim
      var INK_FULL = "#141414";

      // Organism tuning. Distances are in tile units (960 per tile).
      var CORE = 3 * PITCH;      // stitches within this radius of the centre never move
      var PULSE = 0.2;           // arms stretch to 1 + PULSE and contract to 1 - PULSE of their length
      var LAG = 2.4;             // radians of phase lag from arm root to tip: the pulse travels outward
      var CURL = 0.16;           // radians the tips sweep sideways during a stroke
      var WAKE = 1.5;            // seconds to ease from the still tile into full motion

      var params = new URLSearchParams(location.search);
      if (params.has("bare")) document.documentElement.classList.add("bare");

      function mod(v, m) { return ((v % m) + m) % m; }
      function wrapT(d) { return d - T * Math.round(d / T); }

      // Each stitch keeps its polar position around its motif centre; `reach`
      // is 0 at the edge of the still core and 1 at the farthest tip.
      var MOTIFS = D.motifs.map(function (m, i) {
        var flat = D.shapes[m[2]], stitches = [], rMax = 0, k;
        for (k = 0; k < flat.length; k += 2) rMax = Math.max(rMax, Math.hypot(flat[k], flat[k + 1]) * PITCH);
        for (k = 0; k < flat.length; k += 2) {
          var x = flat[k] * PITCH, y = flat[k + 1] * PITCH, r = Math.hypot(x, y);
          stitches.push({ r: r, a: Math.atan2(y, x), reach: Math.max(0, r - CORE) / (rMax - CORE) });
        }
        return {
          x: m[0], y: m[1], stitches: stitches, rMax: rMax,
          omega: 2 * Math.PI / (3.4 + 1.6 * mod(i * 0.618, 1)),   // each organism keeps its own rhythm
          phase: i * 2.39996,
          spin: i % 2 ? 1 : -1,
          pokedAt: -Infinity
        };
      });

      // Fast contraction, slower relaxation: sin with a second harmonic, in [-1, 1].
      function beat(p) { return (Math.sin(p) - 0.3 * Math.sin(2 * p)) / 1.25; }

      // Where a stitch sits at time t. The core stays put; beyond it each arm
      // is scaled along its own length, so arms contract and expand while the
      // centre holds still.
      function place(m, s, t, life, out) {
        var dr = 0, da = 0;
        if (s.r > CORE && life > 0) {
          var heading = m.phase * 3 + m.spin * 0.12 * t + 0.5 * Math.sin(0.07 * t + m.phase);
          var side = 0.65 + 0.35 * Math.cos(s.a - heading);   // the leading side reaches further
          var f = PULSE * beat(m.omega * t + m.phase - LAG * s.reach) * side;
          var since = t - m.pokedAt;
          if (since >= 0 && since < 4) {                       // startle: snap in, then ripple back out
            var env = (1 - Math.exp(-since * 14)) * Math.exp(-since * 2.2);
            f -= env * (0.3 - 0.08 * Math.sin(9 * since - 4 * s.reach));
          }
          dr = (s.r - CORE) * f * life;
          da = CURL * s.reach * s.reach * Math.sin(0.5 * m.omega * t + m.phase * 1.7 + 1.1) * life;
        }
        var r = s.r + dr, a = s.a + da;
        out.x = m.x + r * Math.cos(a);
        out.y = m.y + r * Math.sin(a);
      }

      // --- drawing -------------------------------------------------------------
      // One 720px tile is redrawn per frame (about 1,800 stitches), then laid
      // across the viewport like the site's repeating background.
      var stage = document.getElementById("stage");
      var ctx = stage.getContext("2d");
      var tile = document.createElement("canvas");
      var tctx = tile.getContext("2d");
      var dpr = 1, tileDirty = true, stageDirty = true;
      var fullInk = params.get("ink") === "full";
      var drift = params.has("drift"), driftX = 0, driftY = 0;
      var simTime = 0;
      var pos = { x: 0, y: 0 };

      function cross(X, Y) {
        tctx.moveTo(X - ARM, Y - ARM); tctx.lineTo(X + ARM, Y + ARM);
        tctx.moveTo(X + ARM, Y - ARM); tctx.lineTo(X - ARM, Y + ARM);
      }

      // Adds one x stitch to the current path, repeated across the tile edges
      // it overlaps so the tile stays seamless.
      function stitch(x, y) {
        x = mod(x, T); y = mod(y, T);
        var x2 = x < EDGE ? x + T : x > T - EDGE ? x - T : NaN;
        var y2 = y < EDGE ? y + T : y > T - EDGE ? y - T : NaN;
        cross(x, y);
        if (!isNaN(x2)) cross(x2, y);
        if (!isNaN(y2)) cross(x, y2);
        if (!isNaN(x2) && !isNaN(y2)) cross(x2, y2);
      }

      function drawTile() {
        tctx.setTransform(1, 0, 0, 1, 0, 0);
        tctx.fillStyle = "#fff";
        tctx.fillRect(0, 0, tile.width, tile.height);
        var k = tile.width / T;
        tctx.setTransform(k, 0, 0, k, 0, 0);
        tctx.strokeStyle = fullInk ? INK_FULL : INK_FAINT;
        tctx.lineCap = "round";
        tctx.lineWidth = STROKE;
        var t = simTime, life = Math.min(1, t / WAKE);
        life = life * life * (3 - 2 * life);
        tctx.beginPath();
        MOTIFS.forEach(function (m) {
          m.stitches.forEach(function (s) { place(m, s, t, life, pos); stitch(pos.x, pos.y); });
        });
        tctx.stroke();
      }

      function drawStage() {
        var size = tile.width;
        var ox = -mod(Math.round(driftX * dpr), size), oy = -mod(Math.round(driftY * dpr), size);
        for (var y = oy; y < stage.height; y += size) {
          for (var x = ox; x < stage.width; x += size) ctx.drawImage(tile, x, y);
        }
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        var size = Math.round(TILE_CSS * dpr);
        if (tile.width !== size) { tile.width = tile.height = size; tileDirty = true; }
        stage.width = Math.round(window.innerWidth * dpr);
        stage.height = Math.round(window.innerHeight * dpr);
        stageDirty = true;
      }
      window.addEventListener("resize", resize);
      resize();

      // --- controls ------------------------------------------------------------
      var playing = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var tempo = 1;
      var btnPlay = document.getElementById("btnPlay");
      var btnInk = document.getElementById("btnInk");
      var btnDrift = document.getElementById("btnDrift");

      function syncControls() {
        btnPlay.textContent = playing ? "Pause" : "Play";
        btnInk.setAttribute("aria-pressed", String(fullInk));
        btnDrift.setAttribute("aria-pressed", String(drift));
      }
      syncControls();

      btnPlay.addEventListener("click", function () { playing = !playing; syncControls(); });
      btnInk.addEventListener("click", function () { fullInk = !fullInk; tileDirty = true; syncControls(); });
      btnDrift.addEventListener("click", function () { drift = !drift; syncControls(); });
      document.getElementById("rngTempo").addEventListener("input", function (e) { tempo = parseFloat(e.target.value); });

      // Click an organism to startle it.
      stage.addEventListener("pointerdown", function (e) {
        if (document.documentElement.classList.contains("bare")) return;
        var tx = (e.clientX + driftX) * T / TILE_CSS, ty = (e.clientY + driftY) * T / TILE_CSS;
        MOTIFS.forEach(function (m) {
          if (Math.hypot(wrapT(tx - m.x), wrapT(ty - m.y)) < m.rMax + PITCH) m.pokedAt = simTime;
        });
        if (!playing) { playing = true; syncControls(); }
      });

      // --- loop ------------------------------------------------------------------
      var last = performance.now();
      function frame(now) {
        requestAnimationFrame(frame);
        var dt = Math.min((now - last) / 1000, 0.05);
        last = now;
        if (playing) {
          simTime += dt * tempo;
          tileDirty = true;
          if (drift) { driftX += dt * tempo * 9; driftY += dt * tempo * 5; }
        }
        if (tileDirty) { drawTile(); tileDirty = false; stageDirty = true; }
        if (stageDirty) { drawStage(); stageDirty = false; }
      }
      requestAnimationFrame(frame);
    })();
    </script>
  </body>
</html>
